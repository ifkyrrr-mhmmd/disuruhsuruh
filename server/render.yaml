services:
  - type: web
    name: disuruhsuruh-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: PAYMENT_MOCK_ENABLED
        value: false
      - key: REFUND_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
